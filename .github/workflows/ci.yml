name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查 (AST)
        run: |
          python -c "
          import sys, ast, glob
          files = glob.glob('**/*.py', recursive=True)
          errors = 0
          for f in files:
              try:
                  with open(f) as fh: ast.parse(fh.read())
                  print(f'  \u2705 {f}')
              except SyntaxError as e:
                  print(f'  \u274c {f}: {e}')
                  errors += 1
          if errors:
              sys.exit(1)
          print(f'All {len(files)} files OK')
          "

      - name: 导入检查
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from utils.helpers import extract_phone_numbers, setup_logger
          from extractors.phone import PhoneExtractor
          import logging
          logger = setup_logger()
          print('  \u2705 All imports OK')
          "

      - name: 电话提取单元测试
        run: |
          python -c "
          from extractors.phone import PhoneExtractor
          pe = PhoneExtractor()
          
          # 手机号
          r = pe.extract('联系电话：13800138000')
          assert '13800138000' in r, f'Expected 13800138000, got {r}'
          print(f'  \u2705 手机号提取: {r}')
          
          # 固话
          r = pe.extract('Tel: 010-88886666')
          assert any('010-88886666' in p for p in r), f'Expected 010-88886666, got {r}'
          print(f'  \u2705 固话提取: {r}')
          
          # 400热线
          r = pe.extract('客服热线：400-123-4567')
          assert any('400' in p for p in r), f'Expected 400 hotline, got {r}'
          print(f'  \u2705 400热线提取: {r}')
          
          print(f'\nAll tests passed!')
          "

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 检查存在关键文件
        run: |
          for f in LICENSE Dockerfile .env.example requirements.txt README.md; do
            if [ -f \"$f\" ]; then
              echo \"  \u2705 $f\"
            else
              echo \"  \u274c $f MISSING!\"
              exit 1
            fi
          done
          echo \"All critical files present\"
